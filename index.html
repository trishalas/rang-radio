<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rang Radio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="radio-app" id="radioApp">


    <!-- ==========================================
         TOP HEADER
    =========================================== -->

    <header class="header">

        <button class="menu-button">
            ☰
        </button>


        <div class="brand">

            <div class="brand-title">
                Rang Radio
            </div>

            <div class="brand-note">
                ♫ 𝄞 ♡ 𝄞 ♫
            </div>

        </div>


        <button class="music-button">
            ♫
        </button>

    </header>



    <!-- ==========================================
         THEME NAVIGATION
    =========================================== -->

    <nav class="theme-nav">

        <button
            class="theme-link active"
            data-theme="romantic">

            Romantic

        </button>


        <button
            class="theme-link"
            data-theme="safar">

            Safar

        </button>


        <button
            class="theme-link"
            data-theme="bhagwanji">

            Bhagwanji

        </button>

    </nav>



    <!-- ==========================================
         MAIN THEME AREA
    =========================================== -->

    <main class="theme-area">


        <!-- Decorative clouds -->

        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>


        <!-- Floating particles -->

        <div class="particles">

            <span>✦</span>
            <span>✧</span>
            <span>♡</span>
            <span>✦</span>
            <span>·</span>
            <span>✧</span>
            <span>♡</span>
            <span>✦</span>
            <span>✧</span>
            <span>·</span>

        </div>


        <!-- =====================================
             ROMANTIC
        ====================================== -->

        <section
            class="theme romantic active"
            data-theme-section="romantic">


            <div class="theme-decoration">

                🌸
                💕

            </div>


            <div class="theme-title">

                <span class="theme-icon">
                    ♡
                </span>

                <h1>
                    Romantic
                </h1>

                <div class="title-line">
                    〰 ♡ 〰
                </div>

            </div>


            <!-- Cartoon illustration -->

            <div class="illustration romantic-art">

                <div class="moon">
                    ♥
                </div>

                <div class="tree">

                    <span>🌸</span>
                    <span>🌸</span>
                    <span>🌸</span>

                </div>


                <div class="couple">

                    <div class="person person-one">
                        🧑🏻
                    </div>

                    <div class="person person-two">
                        👩🏻
                    </div>

                    <div class="heart">
                        ♥
                    </div>

                </div>


                <div class="flowers">
                    🌷 🌸 🌷 🌸 🌷
                </div>

            </div>


            <!-- Music strings -->

            <div class="music-strings romantic-strings">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <button
                class="big-play"
                onclick="toggleMusic()">

                ▶

            </button>

        </section>



        <!-- =====================================
             SAFAR
        ====================================== -->

        <section
            class="theme safar"
            data-theme-section="safar">


            <div class="theme-title">

                <span class="theme-icon">
                    ☀
                </span>

                <h1>
                    Safar
                </h1>

                <div class="title-line">
                    〰 ✦ 〰
                </div>

            </div>


            <div class="illustration safar-art">


                <div class="sun">
                    ☀
                </div>


                <div class="mountain mountain-one">
                    ⛰
                </div>

                <div class="mountain mountain-two">
                    ⛰
                </div>


                <div class="road">
                    ╱ ╲
                </div>


                <div class="van">
                    🚐
                </div>


                <div class="signs">

                    <span>
                        Mountains
                    </span>

                    <span>
                        Beach
                    </span>

                    <span>
                        Adventure
                    </span>

                </div>


                <div class="birds">
                    𓅃 𓅃 𓅃
                </div>

            </div>


            <div class="music-strings safar-strings">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <button
                class="big-play"
                onclick="toggleMusic()">

                ▶

            </button>

        </section>



        <!-- =====================================
             BHAGWANJI
        ====================================== -->

        <section
            class="theme bhagwanji"
            data-theme-section="bhagwanji">


            <div class="theme-title">

                <span class="theme-icon">
                    ॐ
                </span>

                <h1>
                    Bhagwanji
                </h1>

                <div class="title-line">
                    〰 ॐ 〰
                </div>

            </div>


            <div class="illustration god-art">


                <div class="temple">

                    🛕

                </div>


                <div class="god krishna">

                    🦚
                    🧒🏽
                    🎵

                </div>


                <div class="god ganesha">

                    🐘
                    🧘

                </div>


                <div class="god hanuman">

                    🙏
                    🐒

                </div>


                <div class="diyas">

                    🪔 🪔 🪔 🪔 🪔

                </div>


            </div>


            <div class="music-strings bhagwanji-strings">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <button
                class="big-play"
                onclick="toggleMusic()">

                ▶

            </button>

        </section>

    </main>



    <!-- ==========================================
         BOTTOM PLAYER
    =========================================== -->

    <footer class="player">


        <div class="album">

            <div class="mini-vinyl">

                ●

            </div>

        </div>


        <div class="track">

            <strong id="songTitle">
                Tum Hi Ho
            </strong>

            <span id="songArtist">
                Romantic • Rang Radio
            </span>

        </div>


        <button
            class="player-control"
            onclick="previousSong()">

            |◀

        </button>


        <button
            class="main-play"
            id="playButton"
            onclick="toggleMusic()">

            ▶

        </button>


        <button
            class="player-control"
            onclick="nextSong()">

            ▶|

        </button>


        <!-- Visualizer -->

        <canvas
            id="visualizer">
        </canvas>


        <button class="volume">
            🔊
        </button>


    </footer>


</div>


<!-- AUDIO -->

<audio id="audioPlayer">

    <source
        src="audio/romantic-1.mp3"
        type="audio/mpeg">

</audio>


<script src="script.js"></script>

</body>

</html>
